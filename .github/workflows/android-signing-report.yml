name: Android Signing Report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-report:
    name: Generate Android SHA-1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.config/.android"
          keytool -genkeypair \
            -v \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Generate signing report
        run: gradle signingReport
